<script>
'use strict';
/* =====================================================================
 * CONFIG — every tunable lives here.
 * ===================================================================== */
const CONFIG = {
  VP_TO_WIN: 10,
  DISCARD_OVER: 7,                 // players holding MORE than this discard half on a 7
  BANK_PER_RESOURCE: 19,
  LIMITS: { road: 15, settlement: 5, city: 4 },
  COSTS: {
    road:       { wood: 1, brick: 1 },
    settlement: { wood: 1, brick: 1, wool: 1, grain: 1 },
    city:       { grain: 2, ore: 3 },
    dev:        { wool: 1, grain: 1, ore: 1 },
  },
  TERRAIN: { wood: 4, brick: 3, wool: 4, grain: 4, ore: 3, desert: 1 },
  NUMBER_TOKENS: [2, 3, 3, 4, 4, 5, 5, 6, 6, 8, 8, 9, 9, 10, 10, 11, 11, 12],
  PORTS: { generic: 4, specific: ['wood', 'brick', 'wool', 'grain', 'ore'] },
  BANK_RATE: 4, GENERIC_PORT_RATE: 3, SPECIFIC_PORT_RATE: 2,
  DEV_DECK: { knight: 14, vp: 5, road: 2, yop: 2, mono: 2, ward: 2, pickpocket: 2, blessing: 2 },
  ROAD_BUILDING_ROADS: 2,
  YOP_CARDS: 2,
  LONGEST_ROAD_MIN: 5,
  LARGEST_ARMY_MIN: 3,
  AWARD_VP: 2,
  DEFAULT_PLAYERS: 4,
  PLAYER_COLORS: ['#e53935', '#1e88e5', '#fb8c00', '#8e24aa'],
  PLAYER_COLOR_NAMES: ['Red', 'Blue', 'Orange', 'Purple'],
  BOT_SPEED_MS: { slow: 1100, normal: 550, fast: 120 },
  DEFAULT_BOT_SPEED: 'normal',
  BOT: {
    MAX_TRADES_PER_TURN: 3,
    WARD_HAND: 7,                  // bot plays Ward when holding at least this many cards
    PICKPOCKET_MIN_VICTIM_CARDS: 3,// bot plays Pickpocket when some opponent holds this many
    KNIGHT_RANDOM: 0.25,           // chance per decision to play a Knight for no particular reason
    MONO_MIN_GAIN: 3,              // bot plays Monopoly only if it would collect at least this many
  },
  HEX_SIZE: 60,
  LOG_MAX: 300,
};

const RES = ['wood', 'brick', 'wool', 'grain', 'ore'];
const TERRAIN_INFO = {
  wood:   { color: '#2f7d32', icon: '🌲', label: 'Wood' },
  brick:  { color: '#b5562b', icon: '🧱', label: 'Brick' },
  wool:   { color: '#8bc34a', icon: '🐑', label: 'Wool' },
  grain:  { color: '#e9c046', icon: '🌾', label: 'Grain' },
  ore:    { color: '#7d8a9c', icon: '⛰️', label: 'Ore' },
  desert: { color: '#dccb98', icon: '🏜️', label: 'Desert' },
};
const DEV_INFO = {
  knight:     { name: 'Knight', desc: 'Move the robber and steal one card. Counts toward Largest Army.' },
  vp:         { name: 'Victory Point', desc: '+1 VP, hidden from opponents. Counts automatically.' },
  road:       { name: 'Road Building', desc: 'Place 2 free roads.' },
  yop:        { name: 'Year of Plenty', desc: 'Take any 2 resources from the bank.' },
  mono:       { name: 'Monopoly', desc: 'Name a resource; every opponent gives you all of theirs.' },
  ward:       { name: 'Ward', desc: 'Immune to the next 7-discard. Used up when it blocks a discard.', anytime: true },
  pickpocket: { name: 'Pickpocket', desc: 'Steal one random card from an opponent you choose.', anytime: true },
  blessing:   { name: 'Blessing of the Harvest', desc: 'Name 2–12 (not 7). Next time it is rolled you get +1 resource per building of yours on those tiles.' },
};
const ANYTIME = new Set(['ward', 'pickpocket']);

/* =====================================================================
 * RNG (seeded, so simulations are reproducible)
 * ===================================================================== */
let G = null;                                   // the single game-state object (plain data, JSON-safe)
function rand() {
  if (!G) return Math.random();
  G.rngState = (G.rngState + 0x6D2B79F5) >>> 0;   // mulberry32, state kept in G
  let t = G.rngState;
  t = Math.imul(t ^ (t >>> 15), t | 1);
  t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
  return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
}
function shuffle(a) {
  for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(rand() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
  return a;
}

/* =====================================================================
 * Static geometry: 19 hexes (radius 2), 54 vertices, 72 edges
 * ===================================================================== */
const GEO = (function buildGeometry() {
  const S = CONFIG.HEX_SIZE, R = 2, SQ = Math.sqrt(3);
  const hexes = [], verts = [], edges = [], vmap = new Map(), emap = new Map();
  const vid = (x, y) => {
    const k = Math.round(x * 10) + ',' + Math.round(y * 10);
    if (!vmap.has(k)) { vmap.set(k, verts.length); verts.push({ id: verts.length, x, y, hexes: [], edges: [], adj: [] }); }
    return vmap.get(k);
  };
  for (let r = -R; r <= R; r++) for (let q = -R; q <= R; q++) {
    if (Math.abs(q + r) > R) continue;
    const h = { id: hexes.length, q, r, x: S * SQ * (q + r / 2), y: S * 1.5 * r, verts: [], edges: [], nbrs: [] };
    for (let i = 0; i < 6; i++) {
      const ang = Math.PI / 180 * (60 * i - 30);
      h.verts.push(vid(h.x + S * Math.cos(ang), h.y + S * Math.sin(ang)));
    }
    for (let i = 0; i < 6; i++) {
      const a = Math.min(h.verts[i], h.verts[(i + 1) % 6]), b = Math.max(h.verts[i], h.verts[(i + 1) % 6]);
      const k = a + '-' + b;
      if (!emap.has(k)) { emap.set(k, edges.length); edges.push({ id: edges.length, a, b, hexes: [] }); }
      const e = emap.get(k);
      h.edges.push(e); edges[e].hexes.push(h.id);
    }
    h.verts.forEach(v => verts[v].hexes.push(h.id));
    hexes.push(h);
  }
  for (const e of edges) {
    verts[e.a].edges.push(e.id); verts[e.b].edges.push(e.id);
    verts[e.a].adj.push(e.b); verts[e.b].adj.push(e.a);
  }
  for (const h of hexes) for (const o of hexes) {
    const dq = h.q - o.q, dr = h.r - o.r;
    if ((Math.abs(dq) + Math.abs(dr) + Math.abs(dq + dr)) / 2 === 1) h.nbrs.push(o.id);
  }
  const mid = e => ({ x: (verts[e.a].x + verts[e.b].x) / 2, y: (verts[e.a].y + verts[e.b].y) / 2 });
  const coast = edges.filter(e => e.hexes.length === 1)
    .sort((e1, e2) => { const m1 = mid(e1), m2 = mid(e2); return Math.atan2(m1.y, m1.x) - Math.atan2(m2.y, m2.x); })
    .map(e => e.id);
  return { hexes, verts, edges, coast };
})();
const otherEnd = (e, v) => (GEO.edges[e].a === v ? GEO.edges[e].b : GEO.edges[e].a);

/* =====================================================================
 * Game creation
 * ===================================================================== */
const isHot = n => n === 6 || n === 8;

function generateBoard() {
  const terr = [];
  for (const [t, c] of Object.entries(CONFIG.TERRAIN)) for (let i = 0; i < c; i++) terr.push(t);
  shuffle(terr);
  G.hexes = GEO.hexes.map((h, i) => ({ terrain: terr[i], number: null }));
  const land = G.hexes.map((h, i) => i).filter(i => G.hexes[i].terrain !== 'desert');
  for (;;) { // reshuffle tokens until no 6/8 are adjacent
    const tok = shuffle(CONFIG.NUMBER_TOKENS.slice());
    G.hexes.forEach(h => { h.number = null; });
    land.forEach((h, i) => { G.hexes[h].number = tok[i]; });
    const ok = GEO.hexes.every(h => !isHot(G.hexes[h.id].number) || h.nbrs.every(j => !isHot(G.hexes[j].number)));
    if (ok) break;
  }
  G.robber = G.hexes.findIndex(h => h.terrain === 'desert');
  // ports: evenly spaced around the 30 coastal edges
  const coast = GEO.coast, N = coast.length;
  const types = shuffle([...Array(CONFIG.PORTS.generic).fill('any'), ...CONFIG.PORTS.specific]);
  const off = Math.floor(rand() * N);
  G.ports = []; G.portAt = Array(GEO.verts.length).fill(null);
  types.forEach((type, i) => {
    const e = coast[(off + Math.floor(i * N / types.length)) % N];
    G.ports.push({ edge: e, type });
    G.portAt[GEO.edges[e].a] = type; G.portAt[GEO.edges[e].b] = type;
  });
}

function newGame(opts = {}) {
  const n = Math.max(3, Math.min(4, opts.numPlayers || CONFIG.DEFAULT_PLAYERS));
  const humanSeat = opts.humanSeat === undefined ? 0 : opts.humanSeat;
  const seed = (opts.seed === undefined ? Math.floor(Math.random() * 4294967296) : opts.seed) >>> 0;
  G = {
    seed, rngState: seed, hexes: [], robber: 0, ports: [], portAt: [],
    buildings: Array(GEO.verts.length).fill(null), roads: Array(GEO.edges.length).fill(null),
    bank: {}, devDeck: [], players: [], turn: 0, turnNumber: 0, phase: 'setup', dice: null,
    devPlayedThisTurn: false, pending: null, queue: [], setupOrder: [], setupIdx: 0,
    longestRoad: null, largestArmy: null, winner: null, log: [], tradesThisTurn: 0,
  };
  RES.forEach(r => { G.bank[r] = CONFIG.BANK_PER_RESOURCE; });
  generateBoard();
  for (const [t, c] of Object.entries(CONFIG.DEV_DECK)) for (let i = 0; i < c; i++) G.devDeck.push(t);
  shuffle(G.devDeck);
  for (let i = 0; i < n; i++) {
    const isBot = i !== humanSeat;
    G.players.push({
      id: i, name: isBot ? CONFIG.PLAYER_COLOR_NAMES[i] + ' Bot' : 'You', color: CONFIG.PLAYER_COLORS[i], isBot,
      res: Object.fromEntries(RES.map(r => [r, 0])), dev: [], knights: 0,
      pieces: { ...CONFIG.LIMITS }, wardActive: false, blessings: [],
    });
  }
  const order = [...Array(n).keys()];
  G.setupOrder = order.concat(order.slice().reverse());   // snake order
  G.pending = { kind: 'setupSettle', pid: G.setupOrder[0] };
  log(`New game: ${n} players (seed ${seed}). Setup in snake order.`);
  return G;
}

/* =====================================================================
 * Helpers & queries
 * ===================================================================== */
const P = id => G.players[id];
const handSize = p => RES.reduce((s, r) => s + p.res[r], 0);
const canAfford = (p, cost) => Object.keys(cost).every(r => p.res[r] >= cost[r]);
function pay(p, cost) { for (const r in cost) { p.res[r] -= cost[r]; G.bank[r] += cost[r]; } }
function giveFromBank(p, r, n) { const k = Math.min(n, G.bank[r]); G.bank[r] -= k; p.res[r] += k; return k; }
function log(msg) { G.log.push(msg); if (G.log.length > CONFIG.LOG_MAX) G.log.shift(); }
const resIcon = r => TERRAIN_INFO[r].icon;
const poss = id => (P(id).isBot ? P(id).name + "'s" : 'Your');
const verb = (id, v) => `${P(id).name} ${P(id).isBot ? v + 's' : v}`;
const isHumanId = id => id !== null && id !== undefined && G.players[id] && !G.players[id].isBot;

function actorId() {
  if (!G || G.phase === 'over') return null;
  return G.pending ? G.pending.pid : G.turn;
}
function isMyMainTurn(pid) { return G.phase === 'main' && G.turn === pid && !G.pending; }
function nextPending() { G.pending = G.queue.length ? G.queue.shift() : null; }

function distanceOk(v) { return !G.buildings[v] && GEO.verts[v].adj.every(u => !G.buildings[u]); }
function touchesOwnRoad(pid, v) { return GEO.verts[v].edges.some(e => G.roads[e] === pid); }
function canSettle(pid, v, setup) {
  if (!distanceOk(v)) return false;
  return setup ? GEO.verts[v].edges.some(e => G.roads[e] === null) : touchesOwnRoad(pid, v);
}
function canCity(pid, v) { const b = G.buildings[v]; return !!b && b.owner === pid && b.type === 'settlement'; }
function canRoad(pid, e) {
  if (G.roads[e] !== null) return false;
  const ed = GEO.edges[e];
  return [ed.a, ed.b].some(v => {
    const b = G.buildings[v];
    if (b) return b.owner === pid;                   // own building connects; opponent's blocks
    return GEO.verts[v].edges.some(e2 => e2 !== e && G.roads[e2] === pid);
  });
}
function validSettleSpots(pid, setup) { return GEO.verts.filter(v => canSettle(pid, v.id, setup)).map(v => v.id); }
function validRoadEdges(pid) { return GEO.edges.filter(e => canRoad(pid, e.id)).map(e => e.id); }
function validCitySpots(pid) { return GEO.verts.filter(v => canCity(pid, v.id)).map(v => v.id); }

function tradeRate(pid, r) {
  let rate = CONFIG.BANK_RATE;
  G.buildings.forEach((b, v) => {
    if (!b || b.owner !== pid || !G.portAt[v]) return;
    if (G.portAt[v] === 'any') rate = Math.min(rate, CONFIG.GENERIC_PORT_RATE);
    else if (G.portAt[v] === r) rate = Math.min(rate, CONFIG.SPECIFIC_PORT_RATE);
  });
  return rate;
}

function longestRoadFor(pid) {
  let best = 0;
  const used = new Set();
  function dfs(v, len) {
    if (len > best) best = len;
    const b = G.buildings[v];
    if (len > 0 && b && b.owner !== pid) return;     // opponent building breaks the road
    for (const e of GEO.verts[v].edges) {
      if (G.roads[e] !== pid || used.has(e)) continue;
      used.add(e); dfs(otherEnd(e, v), len + 1); used.delete(e);
    }
  }
  GEO.verts.forEach(v => { if (v.edges.some(e => G.roads[e] === pid)) dfs(v.id, 0); });
  return best;
}

function vpOf(pid, includeHidden = true) {
  let vp = 0;
  G.buildings.forEach(b => { if (b && b.owner === pid) vp += b.type === 'city' ? 2 : 1; });
  if (G.longestRoad === pid) vp += CONFIG.AWARD_VP;
  if (G.largestArmy === pid) vp += CONFIG.AWARD_VP;
  if (includeHidden) vp += P(pid).dev.filter(c => c.type === 'vp').length;
  return vp;
}

function updateAwards() {
  // Longest Road: holder keeps it on a tie; a broken road can hand it on or set it aside.
  const lens = G.players.map(p => longestRoadFor(p.id));
  const max = Math.max(...lens), holder = G.longestRoad;
  if (!(holder !== null && lens[holder] >= max && lens[holder] >= CONFIG.LONGEST_ROAD_MIN)) {
    let next = null;
    if (max >= CONFIG.LONGEST_ROAD_MIN) {
      const leaders = lens.map((l, i) => (l === max ? i : -1)).filter(i => i >= 0);
      if (leaders.length === 1) next = leaders[0];
    }
    if (next !== holder) {
      G.longestRoad = next;
      log(next === null ? 'Longest Road is set aside.' : `${verb(next, 'take')} Longest Road (${max}).`);
    }
  }
  // Largest Army: must strictly exceed the holder.
  for (const p of G.players) {
    if (p.knights < CONFIG.LARGEST_ARMY_MIN || G.largestArmy === p.id) continue;
    if (G.largestArmy === null || p.knights > P(G.largestArmy).knights) {
      G.largestArmy = p.id; log(`${verb(p.id, 'take')} Largest Army (${p.knights} knights).`);
    }
  }
}

/** Called at the end of every mutating action. */
function post() {
  if (G.phase === 'over') return;
  updateAwards();
  if (G.phase !== 'setup' && vpOf(G.turn) >= CONFIG.VP_TO_WIN) {
    G.phase = 'over'; G.winner = G.turn; G.pending = null; G.queue = [];
    log(`🏆 ${verb(G.turn, 'win')} with ${vpOf(G.turn)} VP!`);
  }
}

/* =====================================================================
 * Pure actions — each validates, mutates G, returns true/false.
 * ===================================================================== */
function doSetupSettle(pid, v) {
  const pd = G.pending;
  if (!pd || pd.kind !== 'setupSettle' || pd.pid !== pid || !canSettle(pid, v, true)) return false;
  const p = P(pid);
  G.buildings[v] = { owner: pid, type: 'settlement' }; p.pieces.settlement--;
  let got = '';
  if (G.setupIdx >= G.players.length) {        // second settlement pays adjacent resources
    for (const h of GEO.verts[v].hexes) {
      const t = G.hexes[h].terrain;
      if (t !== 'desert' && giveFromBank(p, t, 1)) got += resIcon(t);
    }
  }
  log(`${p.name} placed a settlement${got ? ' and collected ' + got : ''}.`);
  G.pending = { kind: 'setupRoad', pid, vertex: v };
  post(); return true;
}

function doSetupRoad(pid, e) {
  const pd = G.pending;
  if (!pd || pd.kind !== 'setupRoad' || pd.pid !== pid || G.roads[e] !== null) return false;
  const ed = GEO.edges[e];
  if (ed.a !== pd.vertex && ed.b !== pd.vertex) return false;
  G.roads[e] = pid; P(pid).pieces.road--;
  G.setupIdx++;
  if (G.setupIdx < G.setupOrder.length) {
    G.pending = { kind: 'setupSettle', pid: G.setupOrder[G.setupIdx] };
  } else {
    G.pending = null; G.phase = 'roll'; G.turn = 0; G.turnNumber = 1;
    log(`Setup complete. ${verb(0, 'roll')} first.`);
  }
  post(); return true;
}

function rollDice(pid, forced) {
  if (G.phase !== 'roll' || pid !== G.turn || G.pending) return false;
  const d = forced || [1 + Math.floor(rand() * 6), 1 + Math.floor(rand() * 6)];
  G.dice = d; G.phase = 'main';
  const sum = d[0] + d[1];
  log(`${P(pid).name} rolled ${sum}.`);
  if (sum === 7) handleSeven(); else produce(sum);
  post(); return true;
}

function handleSeven() {
  const q = [];
  for (let k = 0; k < G.players.length; k++) {
    const p = P((G.turn + k) % G.players.length), n = handSize(p);
    if (n <= CONFIG.DISCARD_OVER) continue;
    if (p.wardActive) { p.wardActive = false; log(`🛡 ${poss(p.id)} Ward blocks the discard (Ward used up).`); continue; }
    q.push({ kind: 'discard', pid: p.id, count: Math.floor(n / 2) });
  }
  q.push({ kind: 'robber', pid: G.turn });
  G.queue = q; nextPending();
}

function produce(n) {
  const gains = G.players.map(() => Object.fromEntries(RES.map(r => [r, 0])));
  const tiles = GEO.hexes.filter(h => G.hexes[h.id].number === n && h.id !== G.robber);
  for (const h of tiles) {
    const r = G.hexes[h.id].terrain;
    for (const v of h.verts) { const b = G.buildings[v]; if (b) gains[b.owner][r] += b.type === 'city' ? 2 : 1; }
  }
  for (const p of G.players) {                     // Blessing of the Harvest
    const i = p.blessings.indexOf(n);
    if (i < 0) continue;
    p.blessings.splice(i, 1);
    let bonus = 0;
    for (const h of tiles) for (const v of h.verts) {
      const b = G.buildings[v];
      if (b && b.owner === p.id) { gains[p.id][G.hexes[h.id].terrain] += 1; bonus++; }
    }
    log(`✨ ${poss(p.id)} Blessing on ${n} triggers: +${bonus} bonus.`);
  }
  const got = G.players.map(() => '');
  for (const r of RES) {
    const total = gains.reduce((s, g) => s + g[r], 0);
    if (!total) continue;
    if (total > G.bank[r]) { log(`Bank shortage: ${total} ${r} needed, ${G.bank[r]} left — nobody collects ${r}.`); continue; }
    G.players.forEach((p, i) => {
      const k = gains[i][r]; if (!k) return;
      p.res[r] += k; G.bank[r] -= k; got[i] += resIcon(r).repeat(k);
    });
  }
  const parts = G.players.map((p, i) => (got[i] ? `${p.name} ${got[i]}` : '')).filter(Boolean);
  if (parts.length) log('  Production: ' + parts.join(', '));
}

function doDiscard(pid, sel) {
  const pd = G.pending;
  if (!pd || pd.kind !== 'discard' || pd.pid !== pid) return false;
  const p = P(pid);
  let total = 0;
  for (const r of RES) {
    const k = sel[r] || 0;
    if (!Number.isInteger(k) || k < 0 || k > p.res[r]) return false;
    total += k;
  }
  if (total !== pd.count) return false;
  for (const r of RES) { const k = sel[r] || 0; p.res[r] -= k; G.bank[r] += k; }
  log(`${p.name} discarded ${total} cards.`);
  nextPending(); post(); return true;
}

function robberVictims(pid, h) {
  const set = new Set();
  for (const v of GEO.hexes[h].verts) {
    const b = G.buildings[v];
    if (b && b.owner !== pid && handSize(P(b.owner)) > 0) set.add(b.owner);
  }
  return [...set];
}

function stealFrom(thief, victim) {
  const v = P(victim), pool = [];
  RES.forEach(r => { for (let i = 0; i < v.res[r]; i++) pool.push(r); });
  if (!pool.length) return null;
  const r = pool[Math.floor(rand() * pool.length)];
  v.res[r]--; P(thief).res[r]++;
  const shown = isHumanId(thief) || isHumanId(victim) ? ` (${resIcon(r)})` : '';
  log(`${P(thief).name} stole a card from ${v.name}${shown}.`);
  return r;
}

function moveRobber(pid, h) {
  const pd = G.pending;
  if (!pd || pd.kind !== 'robber' || pd.pid !== pid) return false;
  if (!Number.isInteger(h) || h < 0 || h >= GEO.hexes.length || h === G.robber) return false;
  G.robber = h;
  log(`${P(pid).name} moved the robber to a ${TERRAIN_INFO[G.hexes[h].terrain].label} ${G.hexes[h].number || ''}.`);
  const victims = robberVictims(pid, h);
  if (victims.length === 0) nextPending();
  else if (victims.length === 1) { stealFrom(pid, victims[0]); nextPending(); }
  else G.pending = { kind: 'steal', pid, victims };
  post(); return true;
}

function doSteal(pid, victim) {
  const pd = G.pending;
  if (!pd || pd.kind !== 'steal' || pd.pid !== pid || !pd.victims.includes(victim)) return false;
  stealFrom(pid, victim);
  nextPending(); post(); return true;
}

function doRoad(pid, e) {
  const pd = G.pending, p = P(pid);
  const free = !!pd && pd.kind === 'freeRoads' && pd.pid === pid;
  if (!free && !isMyMainTurn(pid)) return false;
  if (!canRoad(pid, e) || p.pieces.road <= 0) return false;
  if (!free && !canAfford(p, CONFIG.COSTS.road)) return false;
  if (!free) pay(p, CONFIG.COSTS.road);
  G.roads[e] = pid; p.pieces.road--;
  log(`${p.name} built a road${free ? ' (free)' : ''}.`);
  if (free) {
    pd.left--;
    if (pd.left <= 0 || p.pieces.road <= 0 || !validRoadEdges(pid).length) nextPending();
  }
  post(); return true;
}

function doSettle(pid, v) {
  const p = P(pid);
  if (!isMyMainTurn(pid) || p.pieces.settlement <= 0 || !canAfford(p, CONFIG.COSTS.settlement) || !canSettle(pid, v, false)) return false;
  pay(p, CONFIG.COSTS.settlement);
  G.buildings[v] = { owner: pid, type: 'settlement' }; p.pieces.settlement--;
  log(`${p.name} built a settlement.`);
  post(); return true;
}

function doCity(pid, v) {
  const p = P(pid);
  if (!isMyMainTurn(pid) || p.pieces.city <= 0 || !canAfford(p, CONFIG.COSTS.city) || !canCity(pid, v)) return false;
  pay(p, CONFIG.COSTS.city);
  G.buildings[v] = { owner: pid, type: 'city' }; p.pieces.city--; p.pieces.settlement++;
  log(`${p.name} upgraded to a city.`);
  post(); return true;
}

function buyDev(pid) {
  const p = P(pid);
  if (!isMyMainTurn(pid) || !G.devDeck.length || !canAfford(p, CONFIG.COSTS.dev)) return false;
  pay(p, CONFIG.COSTS.dev);
  const type = G.devDeck.pop();
  p.dev.push({ type, bought: G.turnNumber });
  log(`${p.name} bought a development card${isHumanId(pid) ? ` (${DEV_INFO[type].name})` : ''}.`);
  post(); return true;
}

function bankTrade(pid, give, get) {
  const p = P(pid);
  if (!isMyMainTurn(pid) || !RES.includes(give) || !RES.includes(get) || give === get) return false;
  const rate = tradeRate(pid, give);
  if (p.res[give] < rate || G.bank[get] < 1) return false;
  p.res[give] -= rate; G.bank[give] += rate;
  p.res[get] += 1; G.bank[get] -= 1;
  G.tradesThisTurn++;
  log(`${p.name} traded ${rate}${resIcon(give)} → 1${resIcon(get)} with the bank.`);
  post(); return true;
}

function endTurn(pid) {
  if (!isMyMainTurn(pid)) return false;
  G.turn = (G.turn + 1) % G.players.length;
  G.turnNumber++; G.phase = 'roll'; G.devPlayedThisTurn = false; G.tradesThisTurn = 0; G.dice = null;
  log(`— ${poss(G.turn)} turn —`);
  post(); return true;
}

/* ---------- Development cards ---------- */
function playableCard(p, type) { return p.dev.find(c => c.type === type && c.bought !== G.turnNumber); }

function canPlayDev(pid, type) {
  if (!G || G.phase === 'over' || G.phase === 'setup' || G.pending) return false;
  const p = P(pid);
  if (type === 'vp' || !playableCard(p, type)) return false;
  if (ANYTIME.has(type)) {
    if (type === 'ward') return !p.wardActive;
    return G.players.some(o => o.id !== pid && handSize(o) > 0);   // pickpocket
  }
  if (G.turn !== pid || G.devPlayedThisTurn) return false;
  if (type === 'road') return p.pieces.road > 0 && validRoadEdges(pid).length > 0;
  if (type === 'yop') return RES.some(r => G.bank[r] > 0);
  return true;
}

function playDev(pid, type) {
  if (!canPlayDev(pid, type)) return false;
  const p = P(pid);
  p.dev.splice(p.dev.indexOf(playableCard(p, type)), 1);
  if (!ANYTIME.has(type)) G.devPlayedThisTurn = true;
  log(`${p.name} played ${DEV_INFO[type].name}.`);
  switch (type) {
    case 'knight': p.knights++; G.queue = [{ kind: 'robber', pid }]; nextPending(); break;
    case 'road': G.pending = { kind: 'freeRoads', pid, left: Math.min(CONFIG.ROAD_BUILDING_ROADS, p.pieces.road) }; break;
    case 'yop': G.pending = { kind: 'yop', pid, left: CONFIG.YOP_CARDS }; break;
    case 'mono': G.pending = { kind: 'mono', pid }; break;
    case 'blessing': G.pending = { kind: 'blessing', pid }; break;
    case 'ward': p.wardActive = true; break;
    case 'pickpocket': G.pending = { kind: 'pickpocket', pid, victims: G.players.filter(o => o.id !== pid && handSize(o) > 0).map(o => o.id) }; break;
  }
  post(); return true;
}

function skipFreeRoads(pid) {
  const pd = G.pending;
  if (!pd || pd.kind !== 'freeRoads' || pd.pid !== pid) return false;
  log(`${P(pid).name} skipped the remaining free road(s).`);
  nextPending(); post(); return true;
}

function chooseYop(pid, r) {
  const pd = G.pending;
  if (!pd || pd.kind !== 'yop' || pd.pid !== pid || !RES.includes(r) || G.bank[r] <= 0) return false;
  giveFromBank(P(pid), r, 1); pd.left--;
  log(`${P(pid).name} took ${resIcon(r)} (Year of Plenty).`);
  if (pd.left <= 0 || RES.every(x => G.bank[x] === 0)) nextPending();
  post(); return true;
}

function chooseMono(pid, r) {
  const pd = G.pending;
  if (!pd || pd.kind !== 'mono' || pd.pid !== pid || !RES.includes(r)) return false;
  let n = 0;
  for (const o of G.players) if (o.id !== pid) { n += o.res[r]; P(pid).res[r] += o.res[r]; o.res[r] = 0; }
  log(`${P(pid).name} monopolised ${resIcon(r)} and collected ${n}.`);
  nextPending(); post(); return true;
}

function chooseBlessing(pid, n) {
  const pd = G.pending;
  if (!pd || pd.kind !== 'blessing' || pd.pid !== pid || !Number.isInteger(n) || n < 2 || n > 12 || n === 7) return false;
  P(pid).blessings.push(n);
  log(`${P(pid).name} blessed the number ${n}.`);
  nextPending(); post(); return true;
}

function choosePickpocket(pid, victim) {
  const pd = G.pending;
  if (!pd || pd.kind !== 'pickpocket' || pd.pid !== pid || !pd.victims.includes(victim)) return false;
  stealFrom(pid, victim);
  nextPending(); post(); return true;
}

/* =====================================================================
 * Bots — botAct(pid) performs exactly one action and returns true.
 * ===================================================================== */
const pips = n => (n ? 6 - Math.abs(7 - n) : 0);
function vertexScore(v) {
  let s = 0; const kinds = new Set();
  for (const h of GEO.verts[v].hexes) {
    const hx = G.hexes[h];
    if (hx.terrain === 'desert') continue;
    s += pips(hx.number) * (h === G.robber ? 0.4 : 1);
    kinds.add(hx.terrain);
  }
  return s + kinds.size * 0.6 + (G.portAt[v] ? 0.8 : 0);
}
const argmax = (arr, f) => { let best = null, bs = -Infinity; for (const x of arr) { const s = f(x); if (s > bs) { bs = s; best = x; } } return best; };
function robberOnMe(pid) { return GEO.hexes[G.robber].verts.some(v => G.buildings[v] && G.buildings[v].owner === pid); }
const richest = ids => argmax(ids, id => handSize(P(id)) + rand() * 0.1);

function roadScore(pid, e) {
  let best = 0;
  for (const w of [GEO.edges[e].a, GEO.edges[e].b]) {
    const b = G.buildings[w];
    const attached = (b && b.owner === pid) || GEO.verts[w].edges.some(x => x !== e && G.roads[x] === pid);
    if (attached) continue;                        // only look beyond the new end
    if (distanceOk(w)) best = Math.max(best, 100 + vertexScore(w));
    for (const e2 of GEO.verts[w].edges) {
      if (e2 === e || G.roads[e2] !== null) continue;
      const u = otherEnd(e2, w);
      if (distanceOk(u)) best = Math.max(best, 40 + vertexScore(u));
    }
  }
  return best + rand() * 0.5;
}
function botBestRoad(pid) { return argmax(validRoadEdges(pid), e => roadScore(pid, e)); }

const missingFor = (p, cost) => RES.reduce((s, r) => s + Math.max(0, (cost[r] || 0) - p.res[r]), 0);
function botGoal(pid) {
  const p = P(pid), cands = [];
  if (p.pieces.city > 0 && validCitySpots(pid).length) cands.push('city');
  if (p.pieces.settlement > 0 && validSettleSpots(pid).length) cands.push('settlement');
  if (cands.length) return cands.sort((a, b) => missingFor(p, CONFIG.COSTS[a]) - missingFor(p, CONFIG.COSTS[b]))[0];
  if (p.pieces.road > 0 && validRoadEdges(pid).length) return 'road';
  if (G.devDeck.length) return 'dev';
  return null;
}
function botTradeChoice(pid) {
  if (G.tradesThisTurn >= CONFIG.BOT.MAX_TRADES_PER_TURN) return null;
  const p = P(pid), goal = botGoal(pid);
  if (!goal) return null;
  const cost = CONFIG.COSTS[goal];
  const need = RES.filter(r => (cost[r] || 0) > p.res[r] && G.bank[r] > 0)
    .sort((a, b) => ((cost[b] || 0) - p.res[b]) - ((cost[a] || 0) - p.res[a]));
  if (!need.length) return null;
  let give = null, bestSur = -1;
  for (const r of RES) {
    if (need.includes(r)) continue;
    const sur = p.res[r] - (cost[r] || 0) - tradeRate(pid, r);
    if (sur >= 0 && sur > bestSur) { give = r; bestSur = sur; }
  }
  return give ? { give, get: need[0] } : null;
}
function bestMonoGain(pid) {
  const r = argmax(RES, x => G.players.reduce((s, o) => s + (o.id !== pid ? o.res[x] : 0), 0));
  return { r, n: G.players.reduce((s, o) => s + (o.id !== pid ? o.res[r] : 0), 0) };
}
function botBlessingNumber(pid) {
  let best = { n: 6, score: 0 };
  for (let n = 2; n <= 12; n++) {
    if (n === 7) continue;
    let s = 0;
    for (const h of GEO.hexes) {
      if (G.hexes[h.id].number !== n || h.id === G.robber) continue;
      for (const v of h.verts) if (G.buildings[v] && G.buildings[v].owner === pid) s += pips(n);
    }
    if (s > best.score) best = { n, score: s };
  }
  return best;
}
function botYopPick(pid) {
  const p = P(pid), goal = botGoal(pid), cost = goal ? CONFIG.COSTS[goal] : {};
  const avail = RES.filter(r => G.bank[r] > 0);
  return argmax(avail, r => Math.max(0, (cost[r] || 0) - p.res[r]) * 10 - p.res[r] + rand() * 0.1);
}
function botRobberHex(pid) {
  return argmax(GEO.hexes.filter(h => h.id !== G.robber).map(h => h.id), h => {
    let s = pips(G.hexes[h].number) * 0.1 + rand() * 0.01;
    for (const v of GEO.hexes[h].verts) {
      const b = G.buildings[v]; if (!b) continue;
      const w = b.type === 'city' ? 2 : 1;
      s += b.owner === pid ? -6 * w : 3 * w + (handSize(P(b.owner)) > 0 ? 0.5 : 0);
    }
    return s;
  });
}
function botDiscardSel(p, count) {
  const sel = Object.fromEntries(RES.map(r => [r, 0]));
  for (let i = 0; i < count; i++) sel[argmax(RES, r => p.res[r] - sel[r])]++;
  return sel;
}
function botChooseDev(pid) {
  if (G.devPlayedThisTurn) return null;
  const p = P(pid);
  if (canPlayDev(pid, 'knight')) {
    const armyChase = p.knights + 1 >= CONFIG.LARGEST_ARMY_MIN && G.largestArmy !== pid &&
      (G.largestArmy === null || p.knights + 1 > P(G.largestArmy).knights);
    if (robberOnMe(pid) || armyChase || rand() < CONFIG.BOT.KNIGHT_RANDOM) return 'knight';
  }
  if (canPlayDev(pid, 'yop')) return 'yop';
  if (canPlayDev(pid, 'mono') && bestMonoGain(pid).n >= CONFIG.BOT.MONO_MIN_GAIN) return 'mono';
  if (canPlayDev(pid, 'road') && !validSettleSpots(pid).length) return 'road';
  if (canPlayDev(pid, 'blessing') && botBlessingNumber(pid).score > 0) return 'blessing';
  return null;
}

function botResolve(pid, pd) {
  const p = P(pid);
  switch (pd.kind) {
    case 'setupSettle': return doSetupSettle(pid, argmax(validSettleSpots(pid, true), v => vertexScore(v) + rand() * 0.1));
    case 'setupRoad': return doSetupRoad(pid, argmax(GEO.verts[pd.vertex].edges.filter(e => G.roads[e] === null), e => roadScore(pid, e)));
    case 'discard': return doDiscard(pid, botDiscardSel(p, pd.count));
    case 'robber': return moveRobber(pid, botRobberHex(pid));
    case 'steal': return doSteal(pid, richest(pd.victims));
    case 'freeRoads': { const e = botBestRoad(pid); return e === null ? skipFreeRoads(pid) : doRoad(pid, e); }
    case 'yop': return chooseYop(pid, botYopPick(pid));
    case 'mono': return chooseMono(pid, bestMonoGain(pid).r);
    case 'blessing': return chooseBlessing(pid, botBlessingNumber(pid).n);
    case 'pickpocket': return choosePickpocket(pid, richest(pd.victims));
  }
  return false;
}

function botTurnStep(pid) {
  const p = P(pid);
  if (G.phase === 'roll') {
    if (robberOnMe(pid) && canPlayDev(pid, 'knight')) return playDev(pid, 'knight');
    return rollDice(pid);
  }
  if (canPlayDev(pid, 'ward') && handSize(p) >= CONFIG.BOT.WARD_HAND) return playDev(pid, 'ward');
  if (canPlayDev(pid, 'pickpocket') && G.players.some(o => o.id !== pid && handSize(o) >= CONFIG.BOT.PICKPOCKET_MIN_VICTIM_CARDS)) return playDev(pid, 'pickpocket');
  const dev = botChooseDev(pid);
  if (dev) return playDev(pid, dev);
  const C = CONFIG.COSTS;
  if (p.pieces.city > 0 && canAfford(p, C.city)) { const v = argmax(validCitySpots(pid), vertexScore); if (v !== null) return doCity(pid, v); }
  const spots = validSettleSpots(pid);
  if (p.pieces.settlement > 0 && canAfford(p, C.settlement) && spots.length) return doSettle(pid, argmax(spots, vertexScore));
  if (G.devDeck.length && canAfford(p, C.dev)) return buyDev(pid);
  if (p.pieces.road > 0 && canAfford(p, C.road) && !(spots.length && p.pieces.settlement > 0)) {
    const e = botBestRoad(pid); if (e !== null) return doRoad(pid, e);
  }
  const t = botTradeChoice(pid);
  if (t) return bankTrade(pid, t.give, t.get);
  return endTurn(pid);
}

function botAct(pid) {
  if (G.phase === 'over') return false;
  return G.pending ? botResolve(pid, G.pending) : botTurnStep(pid);
}

/* =====================================================================
 * UI (browser only)
 * ===================================================================== */
const UI = { mode: null, speed: CONFIG.DEFAULT_BOT_SPEED, timer: null, human: 0, discardSel: null, discardKey: null, logLen: -1, logLast: null, trade: null, diceKey: null };
const $ = id => document.getElementById(id);
const ico = (name, cls = 'mi') => `<svg class="${cls}" aria-hidden="true"><use href="#i-${name}"/></svg>`;
const LABEL = r => TERRAIN_INFO[r].label;
const ICON_OF = { '🌲': 'wood', '🧱': 'brick', '🐑': 'wool', '🌾': 'grain', '⛰️': 'ore', '🛡': 'shield', '✨': 'star', '🏆': 'trophy' };
const DEV_SHORT = {
  knight: 'Move the robber and steal 1 card.', vp: 'Hidden +1 VP.', road: 'Build 2 roads for free.',
  yop: 'Take any 2 resources.', mono: 'Take all of 1 resource from rivals.', ward: 'Skip your next 7-discard.',
  pickpocket: 'Steal 1 card from a rival.', blessing: '+1 per building on a number, once.',
};
function shade(hex, f) {
  const n = parseInt(hex.slice(1), 16);
  return '#' + [n >> 16, (n >> 8) & 255, n & 255].map(v => Math.max(0, Math.min(255, Math.round(v * f))).toString(16).padStart(2, '0')).join('');
}
const esc = s => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;');

function modeAvailable(mode) {
  const h = UI.human, p = P(h);
  if (!isMyMainTurn(h)) return false;
  if (mode === 'road') return p.pieces.road > 0 && canAfford(p, CONFIG.COSTS.road) && validRoadEdges(h).length > 0;
  if (mode === 'settlement') return p.pieces.settlement > 0 && canAfford(p, CONFIG.COSTS.settlement) && validSettleSpots(h).length > 0;
  if (mode === 'city') return p.pieces.city > 0 && canAfford(p, CONFIG.COSTS.city) && validCitySpots(h).length > 0;
  return false;
}

function humanTargets() {
  const h = UI.human, pd = G.pending, t = { verts: [], edges: [], hexes: [] };
  if (G.phase === 'over') return t;
  if (pd) {
    if (pd.pid !== h) return t;
    if (pd.kind === 'setupSettle') t.verts = validSettleSpots(h, true);
    else if (pd.kind === 'setupRoad') t.edges = GEO.verts[pd.vertex].edges.filter(e => G.roads[e] === null);
    else if (pd.kind === 'freeRoads') t.edges = validRoadEdges(h);
    else if (pd.kind === 'robber') t.hexes = GEO.hexes.filter(x => x.id !== G.robber).map(x => x.id);
  } else if (UI.mode === 'road') t.edges = validRoadEdges(h);
  else if (UI.mode === 'settlement') t.verts = validSettleSpots(h);
  else if (UI.mode === 'city') t.verts = validCitySpots(h);
  return t;
}

/* ---------- board art ---------- */
const TILE_COLORS = { wood: ['#4fa046', '#21612a'], brick: ['#e48a5a', '#a2472a'], wool: ['#b9e07e', '#6aa83c'], grain: ['#f9da72', '#d5a12b'], ore: ['#b6bfca', '#65707d'], desert: ['#f5e5b6', '#d5ba78'] };
const SPOTS = [[0, -35], [-30, -17.5], [30, -17.5], [-30, 17.5], [30, 17.5], [0, 35]];
const jitter = (i, k) => { const x = Math.sin(i * 12.9898 + k * 78.233) * 43758.5453; return x - Math.floor(x); };
const g = (x, y, s, body) => `<g transform="translate(${x.toFixed(1)} ${y.toFixed(1)}) scale(${s.toFixed(2)})">${body}</g>`;
const ART = {
  tree: '<rect x="-1.6" y="5" width="3.2" height="5" rx="1" fill="#5b3a1e"/><path d="M0,-4 L9,7 L-9,7Z" fill="#1d5a24"/><path d="M0,-12 L7,2 L-7,2Z" fill="#2f8033"/>',
  sheaf: '<path d="M-4,9 L-2,-3 M0,9 L0,-5 M4,9 L2,-3" stroke="#9f6c0c" stroke-width="1.3" stroke-linecap="round"/><g fill="#f0bb2a" stroke="#9f6c0c" stroke-width=".7"><ellipse cx="-2.3" cy="-5" rx="1.9" ry="3.6"/><ellipse cx="0" cy="-8" rx="2" ry="3.8"/><ellipse cx="2.3" cy="-5" rx="1.9" ry="3.6"/></g>',
  sheep: '<g fill="#fff" stroke="#b9c1c9" stroke-width=".8"><circle cx="-4" cy="0" r="4.6"/><circle cx="1" cy="-1.5" r="5"/><circle cx="4.5" cy="1.5" r="4.2"/><circle cx="-0.5" cy="3" r="4.2"/></g><ellipse cx="8.5" cy="-1" rx="2.6" ry="2.2" fill="#333"/><path d="M-3,7 v3 M3,7 v3" stroke="#333" stroke-width="1.5" stroke-linecap="round"/>',
  tuft: '<path d="M-3,5 Q-3,0 -7,-3 M0,5 Q0,-1 0,-6 M3,5 Q3,0 7,-3" stroke="#3f8a2a" stroke-width="1.6" fill="none" stroke-linecap="round"/><path d="M-1.5,5 Q-1,1 -3.5,-1 M1.5,5 Q1,1 3.5,-1" stroke="#5aa83a" stroke-width="1.3" fill="none" stroke-linecap="round"/>',
  peak: '<path d="M-14,9 L-2,-11 L10,9Z" fill="#596572"/><path d="M0,9 L8,-4 L16,9Z" fill="#7a8794"/><path d="M-2,-11 L-5.5,-5 L-2,-6.3 L1.4,-5Z" fill="#fff"/><path d="M8,-4 L6,-0.7 L8,-1.4 L10,-0.6Z" fill="#fff"/>',
  bricks: '<g fill="#b4502a" stroke="#f3c7a6" stroke-width=".9"><rect x="-10" y="0" width="9.5" height="5.5" rx="1"/><rect x="0.5" y="0" width="9.5" height="5.5" rx="1"/><rect x="-5" y="-6" width="9.5" height="5.5" rx="1"/></g>',
  mound: '<path d="M-11,5 Q0,-7 11,5Z" fill="#c9693f"/>',
  dune: '<path d="M-13,4 Q-4,-5 5,4 M-2,7 Q6,0 14,7" stroke="#c4a25c" stroke-width="1.8" fill="none" stroke-linecap="round"/>',
  cactus: '<path d="M0,9 V-7 M0,0 H-4 V-4 M0,2 H4 V-3" stroke="#4d8a3a" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>',
};
function tileDecor(id, terrain, cx, cy) {
  const plan = {
    wood: ['tree', 'tree', 'tree', 'tree', 'tree', 'tree'],
    grain: ['sheaf', 'sheaf', 'sheaf', 'sheaf', 'sheaf', 'sheaf'],
    wool: ['sheep', 'tuft', 'tuft', 'sheep', 'sheep', 'tuft'],
    ore: ['peak', null, null, 'peak', 'peak', null],
    brick: ['bricks', 'mound', 'mound', 'bricks', 'bricks', null],
    desert: ['dune', 'cactus', null, 'dune', 'dune', null],
  }[terrain];
  return plan.map((art, k) => {
    if (!art) return '';
    const [dx, dy] = SPOTS[k], s = 1 + jitter(id, k) * 0.18;
    return g(cx + dx + (jitter(id, k + 9) - 0.5) * 4, cy + dy + (jitter(id, k + 3) - 0.5) * 3, s, ART[art]);
  }).join('');
}
function boardDefs() {
  return '<defs>'
    + Object.entries(TILE_COLORS).map(([t, [a, b]]) => `<radialGradient id="g-${t}" cx="50%" cy="38%" r="72%"><stop offset="0" stop-color="${a}"/><stop offset="1" stop-color="${b}"/></radialGradient>`).join('')
    + '<pattern id="waves" width="56" height="26" patternUnits="userSpaceOnUse"><path d="M0,13 Q14,6 28,13 T56,13" fill="none" stroke="#ffffff" stroke-opacity=".08" stroke-width="2"/></pattern>'
    + '<filter id="sh" x="-50%" y="-50%" width="200%" height="200%"><feDropShadow dx="0" dy="2" stdDeviation="1.5" flood-color="#000" flood-opacity=".42"/></filter>'
    + '</defs>';
}
function piece(b, x, y) {
  const c = P(b.owner).color, d = shade(c, 0.6), k = '#1b2229';
  const body = b.type === 'city'
    ? `<path d="M-14,10 L14,10 L14,-3 L3,-3 L3,-10 L-5.5,-18.5 L-14,-10Z" fill="${c}" stroke="${k}" stroke-width="2" stroke-linejoin="round"/>`
      + `<path d="M3,-10 L-5.5,-18.5 L-14,-10 L-14,-7 L-5.5,-15.5 L3,-7Z" fill="${d}"/><path d="M-9,-6 h3 M-9,1 h3 M6,2 h3 M-1,2 h3" stroke="${d}" stroke-width="3"/>`
    : `<path d="M-9.5,9 L9.5,9 L9.5,-1.5 L0,-10.5 L-9.5,-1.5Z" fill="${c}" stroke="${k}" stroke-width="2" stroke-linejoin="round"/>`
      + `<path d="M-9.5,-1.5 L0,-10.5 L9.5,-1.5 L9.5,1.5 L0,-7.5 L-9.5,1.5Z" fill="${d}"/><rect x="-2" y="3" width="4" height="6" fill="${d}"/>`;
  return `<g transform="translate(${x} ${y})" filter="url(#sh)">${body}</g>`;
}

function renderBoard() {
  const t = humanTargets(), out = [boardDefs()];
  const pt = (x, y) => `${x.toFixed(1)},${y.toFixed(1)}`;
  const full = h => h.verts.map(v => pt(GEO.verts[v].x, GEO.verts[v].y)).join(' ');
  const inset = (h, f) => h.verts.map(v => pt(h.x + (GEO.verts[v].x - h.x) * f, h.y + (GEO.verts[v].y - h.y) * f)).join(' ');
  const lastSum = G.dice && G.phase !== 'setup' ? G.dice[0] + G.dice[1] : null;
  out.push('<rect x="-330" y="-305" width="660" height="610" fill="url(#waves)"/>');
  // surf, then beach
  out.push(`<g stroke-linejoin="round">${GEO.hexes.map(h => `<polygon points="${full(h)}" fill="#ffffff" fill-opacity=".16" stroke="#ffffff" stroke-opacity=".16" stroke-width="40"/>`).join('')}</g>`);
  out.push(`<g stroke-linejoin="round">${GEO.hexes.map(h => `<polygon points="${full(h)}" fill="#ecd9a2" stroke="#ecd9a2" stroke-width="18"/>`).join('')}</g>`);
  // ports: wooden piers + badge
  for (const port of G.ports) {
    const ed = GEO.edges[port.edge], hx = GEO.hexes[ed.hexes[0]];
    const mx = (GEO.verts[ed.a].x + GEO.verts[ed.b].x) / 2, my = (GEO.verts[ed.a].y + GEO.verts[ed.b].y) / 2;
    const px = hx.x + (mx - hx.x) * 1.78, py = hx.y + (my - hx.y) * 1.78;
    for (const v of [ed.a, ed.b]) {
      const sx = GEO.verts[v].x + (px - GEO.verts[v].x) * 0.2, sy = GEO.verts[v].y + (py - GEO.verts[v].y) * 0.2;
      out.push(`<line x1="${sx}" y1="${sy}" x2="${px}" y2="${py}" stroke="#6e4520" stroke-width="7" stroke-linecap="round"/><line x1="${sx}" y1="${sy}" x2="${px}" y2="${py}" stroke="#b9854d" stroke-width="3.5" stroke-linecap="round" stroke-dasharray="5 2"/>`);
    }
    const generic = port.type === 'any';
    out.push(`<g><title>${generic ? '3:1 port: trade 3 of any one resource for 1' : `2:1 port: trade 2 ${LABEL(port.type)} for 1`}</title>`
      + `<circle cx="${px}" cy="${py}" r="20" fill="#fffaf0" stroke="#6e4520" stroke-width="2.5" filter="url(#sh)"/>`
      + (generic ? `<text class="portlbl big" x="${px}" y="${py}">3:1</text>`
        : `<use href="#i-${port.type}" x="${px - 9}" y="${py - 17}" width="18" height="18"/><text class="portlbl" x="${px}" y="${py + 10}">2:1</text>`)
      + '</g>');
  }
  // tiles
  for (const h of GEO.hexes) {
    const hx = G.hexes[h.id], tgt = t.hexes.includes(h.id);
    out.push(`<polygon class="hex${tgt ? ' hex-target' : ''}" data-hex="${h.id}" points="${inset(h, 0.94)}" fill="url(#g-${hx.terrain})"><title>${TERRAIN_INFO[hx.terrain].label}${hx.number ? ' · ' + hx.number : ''}</title></polygon>`);
    out.push(`<g pointer-events="none">${tileDecor(h.id, hx.terrain, h.x, h.y)}</g>`);
    if (hx.number) {
      const n = hx.number, k = pips(n), robbed = h.id === G.robber;
      out.push(`<g pointer-events="none"${robbed ? ' opacity=".5"' : ''}><circle class="tok${lastSum === n && !robbed ? ' hit' : ''}" cx="${h.x}" cy="${h.y}" r="19" filter="url(#sh)"/><text class="num${isHot(n) ? ' hot' : ''}" x="${h.x}" y="${h.y - 2.5}">${n}</text>`);
      for (let i = 0; i < k; i++) out.push(`<circle cx="${h.x + (i - (k - 1) / 2) * 4.4}" cy="${h.y + 10.5}" r="1.6" fill="${isHot(n) ? '#c62828' : '#2a2a2a'}"/>`);
      out.push('</g>');
    }
  }
  // robber
  { const h = GEO.hexes[G.robber], x = h.x, y = h.y - 4;
    out.push(`<g transform="translate(${x} ${y})" pointer-events="none" filter="url(#sh)"><ellipse cx="0" cy="17" rx="11" ry="4" fill="#22262c"/>`
      + '<path d="M-9,17 C-10,8 -6,4 -3,2 C-8,-1 -8,-9 -4,-12 C-2,-14.5 2,-14.5 4,-12 C8,-9 8,-1 3,2 C6,4 10,8 9,17Z" fill="#383e46" stroke="#14171b" stroke-width="1.5"/>'
      + '<path d="M-3,-10 C-5,-7 -5,-3 -3,-1" stroke="#ffffff" stroke-opacity=".3" stroke-width="2" fill="none" stroke-linecap="round"/></g>'); }
  // roads
  GEO.edges.forEach(e => {
    const o = G.roads[e.id]; if (o === null) return;
    const a = GEO.verts[e.a], b = GEO.verts[e.b], f = 0.15;
    const c = [a.x + (b.x - a.x) * f, a.y + (b.y - a.y) * f, b.x - (b.x - a.x) * f, b.y - (b.y - a.y) * f].map(v => v.toFixed(1));
    out.push(`<g filter="url(#sh)"><line x1="${c[0]}" y1="${c[1]}" x2="${c[2]}" y2="${c[3]}" stroke="#1b2229" stroke-width="11" stroke-linecap="round"/><line x1="${c[0]}" y1="${c[1]}" x2="${c[2]}" y2="${c[3]}" stroke="${P(o).color}" stroke-width="7" stroke-linecap="round"/></g>`);
  });
  for (const e of t.edges) {
    const a = GEO.verts[GEO.edges[e].a], b = GEO.verts[GEO.edges[e].b];
    const ax = a.x + (b.x - a.x) * 0.2, ay = a.y + (b.y - a.y) * 0.2, bx = b.x - (b.x - a.x) * 0.2, by = b.y - (b.y - a.y) * 0.2;
    out.push(`<g class="edge-target" data-edge="${e}"><line x1="${ax}" y1="${ay}" x2="${bx}" y2="${by}" stroke="transparent" stroke-width="16"/><line class="target-edge" x1="${ax}" y1="${ay}" x2="${bx}" y2="${by}"/>`
      + `<circle class="target" cx="${(a.x + b.x) / 2}" cy="${(a.y + b.y) / 2}" r="7"/></g>`);
  }
  G.buildings.forEach((b, v) => { if (b) out.push(piece(b, GEO.verts[v].x, GEO.verts[v].y)); });
  for (const v of t.verts) out.push(`<circle class="target" data-vert="${v}" cx="${GEO.verts[v].x}" cy="${GEO.verts[v].y}" r="10"/>`);
  $('board').innerHTML = out.join('');
}

/* ---------- prompt & status ---------- */
function promptHTML() {
  const h = UI.human, pd = G.pending;
  const msg = s => `<span class="msg">${s}</span>`;
  const resBtn = (act, r, dis) => `<button class="chip" data-act="${act}" data-arg="${r}"${dis ? ' disabled' : ''}>${ico(r)}${LABEL(r)}</button>`;
  const who = (act, v) => `<button class="chip" data-act="${act}" data-arg="${v}"><span class="dot" style="background:${P(v).color}"></span>${P(v).name} · ${handSize(P(v))} cards</button>`;
  if (G.phase === 'over') return msg(`${P(G.winner).name} ${P(G.winner).isBot ? 'wins' : 'win'} the game.`) + '<button class="chip" data-act="newgame">Play again</button>';
  if (pd && pd.pid !== h) {
    const what = { setupSettle: 'is placing a settlement', setupRoad: 'is placing a road', discard: 'is discarding', robber: 'is moving the robber', steal: 'is choosing who to rob', freeRoads: 'is building free roads', yop: 'is taking resources', mono: 'is naming a monopoly', blessing: 'is choosing a number to bless', pickpocket: 'is picking a pocket' }[pd.kind] || 'is deciding';
    return msg(`${P(pd.pid).name} ${what}…`);
  }
  if (pd) {
    const first = G.setupIdx < G.players.length;
    switch (pd.kind) {
      case 'setupSettle': return msg(first ? 'Place your first settlement on a glowing corner.' : 'Place your second settlement. It pays you one of each resource around it.');
      case 'setupRoad': return msg('Now place a road touching that settlement.');
      case 'discard': return msg(`Choose ${pd.count} cards to discard.`);
      case 'robber': return msg('Move the robber: click a glowing tile.');
      case 'steal': return msg('Steal a card from:') + pd.victims.map(v => who('steal', v)).join('');
      case 'freeRoads': return msg(`Place a free road (${pd.left} left).`) + '<button class="chip" data-act="skiproads">Skip</button>';
      case 'yop': return msg(`Take a resource (${pd.left} left):`) + RES.map(r => resBtn('yop', r, G.bank[r] <= 0)).join('');
      case 'mono': return msg('Name the resource to monopolise:') + RES.map(r => resBtn('mono', r)).join('');
      case 'blessing': return msg('Bless a number:') + [2, 3, 4, 5, 6, 8, 9, 10, 11, 12].map(n => `<button class="numchip${isHot(n) ? ' hot' : ''}" data-act="bless" data-arg="${n}">${n}<i>${'●'.repeat(pips(n))}</i></button>`).join('');
      case 'pickpocket': return msg('Pick a pocket:') + pd.victims.map(v => who('pick', v)).join('');
    }
  }
  if (G.turn === h) {
    if (G.phase === 'roll') return msg('Your turn. Roll the dice, or play a card first.');
    if (UI.mode) return msg(`Click a glowing spot to build your ${UI.mode}. Press Esc to cancel.`) + '<button class="chip" data-act="mode" data-arg="">Cancel</button>';
    return msg('Build, trade or play a card, then end your turn.');
  }
  const any = ['ward', 'pickpocket'].some(t => canPlayDev(h, t));
  return msg(`${P(G.turn).name} is playing.${any ? ' You can still play an Any Time card.' : ''}`);
}

function renderTop() {
  const s = $('status');
  if (G.phase === 'setup') s.textContent = `Setup · round ${G.setupIdx < G.players.length ? 1 : 2} of 2`;
  else if (G.phase === 'over') s.textContent = `Game over after ${G.turnNumber} turns`;
  else s.textContent = `Turn ${G.turnNumber} · ${CONFIG.VP_TO_WIN} VP to win`;
  const pr = $('prompt'), pd = G.pending;
  pr.innerHTML = promptHTML();
  pr.classList.toggle('mine', G.phase !== 'over' && (pd ? pd.pid === UI.human : G.turn === UI.human));
}

/* ---------- players ---------- */
function playerRow(p, opts = {}) {
  const me = p.id === UI.human, pub = vpOf(p.id, false), full = vpOf(p.id, true), vp = me || opts.reveal ? full : pub;
  const actor = actorId();
  const badges = [];
  if (G.longestRoad === p.id) badges.push(`<span class="badge award">${ico('road')}Longest Road</span>`);
  if (G.largestArmy === p.id) badges.push(`<span class="badge award">${ico('knight')}Largest Army</span>`);
  if (p.wardActive) badges.push(`<span class="badge ward">${ico('shield')}Ward up</span>`);
  else if (me && !opts.reveal) badges.push(`<span class="badge">${ico('shield')}No Ward</span>`);
  p.blessings.forEach(n => badges.push(`<span class="badge bless">${ico('star')}Blessed ${n}</span>`));
  const cur = !opts.reveal && (G.phase === 'setup' ? actor === p.id : G.turn === p.id);
  return `<div class="pl${cur ? ' cur' : ''}" style="--pc:${p.color}">
    <div class="av">${ico(p.isBot ? 'bot' : 'person', '')}</div>
    <div style="min-width:0">
      <div class="pl-name"><span>${p.name}</span>${!opts.reveal && actor === p.id && p.isBot ? '<span class="thinking"><i></i><i></i><i></i></span>' : ''}</div>
      <div class="pl-stats"><span class="st" title="Resource cards">${ico('cards')}${handSize(p)}</span><span class="st" title="Development cards">${ico('dev')}${p.dev.length}</span><span class="st" title="Knights played">${ico('knight')}${p.knights}</span><span class="st" title="Longest road">${ico('road')}${longestRoadFor(p.id)}</span></div>
      <div class="pl-badges">${badges.join('')}</div>
    </div>
    <div class="pl-vp" title="${me && full > pub ? `${full - pub} from hidden VP cards` : 'Victory points'}"><b>${vp}</b><small>VP</small></div>
  </div>`;
}
function renderPlayers() { $('players').innerHTML = G.players.map(p => playerRow(p)).join(''); }

/* ---------- dock ---------- */
function resCard(r, n, extra = '') {
  return `<div class="rcard r-${r}${n ? '' : ' zero'}" title="${LABEL(r)}: ${n}"><span class="art">${ico(r, '')}</span><span class="nm">${LABEL(r)}</span><b class="n">${n}</b>${extra}</div>`;
}
function renderHand() {
  const p = P(UI.human);
  $('hand').innerHTML = RES.map(r => resCard(r, p.res[r])).join('');
}
function renderDev() {
  const h = UI.human, p = P(h), types = [...new Set(p.dev.map(c => c.type))];
  if (!types.length) { $('devHand').innerHTML = '<div class="nodev">No development cards yet. Buy one with wool, grain and ore.</div>'; return; }
  $('devHand').innerHTML = types.map(t => {
    const cards = p.dev.filter(c => c.type === t), fresh = cards.filter(c => c.bought === G.turnNumber).length, info = DEV_INFO[t];
    return `<div class="dcard" title="${esc(info.desc)}"><b class="n">${cards.length}</b>
      <div class="dn">${info.name}${info.anytime ? '<span class="tag">ANY TIME</span>' : ''}${fresh ? '<span class="tag new">NEW</span>' : ''}</div>
      <div class="dd">${DEV_SHORT[t]}</div>
      ${t === 'vp' ? '<span class="vpnote">Counts automatically</span>' : `<button data-act="play" data-arg="${t}"${canPlayDev(h, t) ? '' : ' disabled'}>Play</button>`}</div>`;
  }).join('');
}
function renderActions() {
  const h = UI.human, p = P(h), my = isMyMainTurn(h);
  document.documentElement.style.setProperty('--me', p.color);
  for (const m of ['road', 'settlement', 'city']) {
    const b = $('btn' + m[0].toUpperCase() + m.slice(1));
    b.disabled = !modeAvailable(m); b.classList.toggle('active', UI.mode === m);
  }
  $('leftRoad').textContent = p.pieces.road; $('leftSettlement').textContent = p.pieces.settlement; $('leftCity').textContent = p.pieces.city;
  $('leftDev').textContent = G.devDeck.length;
  document.querySelectorAll('.cost[data-cost]').forEach(el => {
    if (el.childElementCount) return;
    const c = CONFIG.COSTS[el.dataset.cost];
    el.innerHTML = Object.keys(c).map(r => ico(r).repeat(c[r])).join('');
  });
  $('btnDev').disabled = !(my && G.devDeck.length && canAfford(p, CONFIG.COSTS.dev));
  $('btnTrade').disabled = !(my && RES.some(r => p.res[r] >= tradeRate(h, r)));
  $('btnRoll').disabled = !(G.phase === 'roll' && G.turn === h && !G.pending);
  $('btnEnd').disabled = !my;
}
const PIPS = { 1: [4], 2: [0, 8], 3: [0, 4, 8], 4: [0, 2, 6, 8], 5: [0, 2, 4, 6, 8], 6: [0, 2, 3, 5, 6, 8] };
const dieHTML = (v, red) => `<div class="die${red ? ' red' : ''}">${Array.from({ length: 9 }, (_, i) => `<i${v && PIPS[v].includes(i) ? ' class="on"' : ''}></i>`).join('')}</div>`;
function renderDice() {
  const el = $('dice'), key = G.dice ? `${G.turnNumber}:${G.dice.join(',')}` : 'none';
  if (key === UI.diceKey) return;
  UI.diceKey = key;
  const d = G.dice || [5, 2];
  el.innerHTML = dieHTML(d[0]) + dieHTML(d[1], true) + `<b class="dsum">${G.dice ? d[0] + d[1] : ''}</b>`;
  el.classList.toggle('idle', !G.dice);
  el.title = G.dice ? `${P(G.turn).name} rolled ${d[0] + d[1]}` : 'Not rolled yet';
  el.classList.remove('rolling');
  if (G.dice) { void el.offsetWidth; el.classList.add('rolling'); }
}

/* ---------- log ---------- */
function logHTML(s) {
  let h = esc(s);
  for (const [e, n] of Object.entries(ICON_OF)) h = h.split(e).join(ico(n));
  for (const p of G.players) h = h.replace(new RegExp(`\\b${p.name}\\b`, 'g'), `<b style="color:${shade(p.color, 0.82)}">${p.name}</b>`);
  return h;
}
function renderLog() {
  const el = $('log'), last = G.log[G.log.length - 1];
  if (UI.logLen === G.log.length && UI.logLast === last) return;
  el.innerHTML = G.log.map(s => `<div${s.startsWith('—') ? ' class="sep"' : ''}>${logHTML(s.replace(/^— | —$/g, ''))}</div>`).join('');
  el.scrollTop = el.scrollHeight; UI.logLen = G.log.length; UI.logLast = last;
}

/* ---------- dialogs ---------- */
function renderModal() {
  const pd = G.pending, m = $('modal');
  if (!(pd && pd.kind === 'discard' && pd.pid === UI.human)) { m.hidden = true; m.innerHTML = ''; return; }
  const p = P(UI.human), key = `${G.turnNumber}-${pd.count}`;
  if (UI.discardKey !== key) { UI.discardKey = key; UI.discardSel = Object.fromEntries(RES.map(r => [r, 0])); }
  const sel = UI.discardSel, chosen = RES.reduce((s, r) => s + sel[r], 0);
  m.hidden = false;
  m.innerHTML = `<div class="sheet" role="dialog" aria-label="Discard cards"><h3>Discard ${pd.count} cards</h3><p>A 7 was rolled and you hold more than ${CONFIG.DISCARD_OVER} cards.</p>
    <div class="row">${RES.map(r => `<div class="pick">${resCard(r, p.res[r] - sel[r])}<div class="stepper">
      <button data-act="ddec" data-arg="${r}" aria-label="Keep one ${LABEL(r)}"${sel[r] <= 0 ? ' disabled' : ''}>−</button><span>${sel[r]}</span>
      <button data-act="dinc" data-arg="${r}" aria-label="Discard one ${LABEL(r)}"${sel[r] >= p.res[r] || chosen >= pd.count ? ' disabled' : ''}>+</button></div></div>`).join('')}</div>
    <div class="foot"><span class="sum">${chosen} of ${pd.count} chosen</span><button class="btn primary" data-act="dok"${chosen !== pd.count ? ' disabled' : ''}>Discard</button></div></div>`;
}

function renderTrade() {
  const m = $('tradeModal'), h = UI.human, p = P(h);
  if (UI.trade && !isMyMainTurn(h)) UI.trade = null;
  if (!UI.trade) { m.hidden = true; m.innerHTML = ''; return; }
  const tr = UI.trade;
  if (tr.give && p.res[tr.give] < tradeRate(h, tr.give)) tr.give = null;
  if (tr.get && (G.bank[tr.get] <= 0 || tr.get === tr.give)) tr.get = null;
  const rate = tr.give ? tradeRate(h, tr.give) : null;
  m.hidden = false;
  m.innerHTML = `<div class="sheet" role="dialog" aria-label="Trade with the bank"><h3>Trade with the bank</h3><p>The bank trades at 4:1. Your ports lower the rate.</p>
    <div class="lbl">You give</div><div class="row">${RES.map(r => {
      const rt = tradeRate(h, r);
      return `<button class="rcard r-${r}${tr.give === r ? ' sel' : ''}" data-act="tgive" data-arg="${r}" title="Give ${rt} ${LABEL(r)}"${p.res[r] < rt ? ' disabled' : ''}><span class="art">${ico(r, '')}</span><span class="nm">${LABEL(r)}</span><b class="n">${p.res[r]}</b><span class="rate">${rt}:1</span></button>`;
    }).join('')}</div>
    <div class="lbl" style="margin-top:22px">You get</div><div class="row">${RES.map(r => `<button class="rcard r-${r}${tr.get === r ? ' sel' : ''}" data-act="tget" data-arg="${r}" title="Bank has ${G.bank[r]}"${G.bank[r] <= 0 || r === tr.give ? ' disabled' : ''}><span class="art">${ico(r, '')}</span><span class="nm">${LABEL(r)}</span><b class="n">${G.bank[r]}</b></button>`).join('')}</div>
    <div class="foot"><span class="sum">${tr.give && tr.get ? `${rate} ${ico(tr.give)} → 1 ${ico(tr.get)}` : 'Pick one to give and one to get.'}</span>
      <button class="btn" data-act="tclose">Done</button><button class="btn primary" data-act="trade"${tr.give && tr.get ? '' : ' disabled'}>Trade</button></div></div>`;
}

function renderOverlay() {
  const o = $('overlay');
  if (G.phase !== 'over') { o.hidden = true; o.innerHTML = ''; return; }
  o.hidden = false;
  const w = P(G.winner);
  const rows = G.players.slice().sort((a, b) => vpOf(b.id) - vpOf(a.id)).map(p => playerRow(p, { reveal: true })).join('');
  o.innerHTML = `<div class="sheet" role="dialog" aria-label="Game over" style="text-align:center">${ico('trophy', 'trophy')}<h3>${w.isBot ? `${w.name} wins` : 'You win!'}</h3><p>${vpOf(w.id)} victory points after ${G.turnNumber} turns. Hidden VP cards are now shown.</p>
    <div class="standings" style="text-align:left">${rows}</div><div class="foot" style="justify-content:center"><button class="btn primary" data-act="newgame">Play again</button></div></div>`;
}

function render() {
  if (typeof document === 'undefined') return;
  if (UI.mode && !modeAvailable(UI.mode)) UI.mode = null;
  renderBoard(); renderTop(); renderPlayers(); renderHand(); renderActions(); renderDev(); renderDice(); renderLog(); renderModal(); renderTrade(); renderOverlay();
  scheduleBot();
}

function scheduleBot() {
  if (UI.timer || !G || G.phase === 'over') return;
  const a = actorId();
  if (a === null || !P(a).isBot) return;
  UI.timer = setTimeout(() => {
    UI.timer = null;
    const a2 = actorId();
    if (a2 !== null && P(a2).isBot && !botAct(a2)) {
      // failsafe: should never happen, but never let a bot stall the game
      log(`(${P(a2).name} could not act; skipping.)`);
      if (G.pending) { G.queue = []; G.pending = null; } else if (G.phase === 'roll') rollDice(a2); else endTurn(a2);
    }
    render();
  }, CONFIG.BOT_SPEED_MS[UI.speed]);
}

function startGame() {
  clearTimeout(UI.timer); UI.timer = null; UI.mode = null; UI.logLen = -1; UI.discardKey = null; UI.trade = null; UI.diceKey = null;
  newGame({ numPlayers: +$('selPlayers').value, humanSeat: UI.human });
}

function bestGive() {
  const h = UI.human, p = P(h);
  return RES.filter(r => p.res[r] >= tradeRate(h, r)).sort((a, b) => (p.res[b] - tradeRate(h, b)) - (p.res[a] - tradeRate(h, a)))[0] || null;
}

function handleAct(act, arg) {
  const h = UI.human;
  switch (act) {
    case 'roll': rollDice(h); break;
    case 'mode': UI.mode = !arg || UI.mode === arg ? null : arg; break;
    case 'buydev': buyDev(h); break;
    case 'end': UI.mode = null; UI.trade = null; endTurn(h); break;
    case 'topen': UI.mode = null; UI.trade = { give: bestGive(), get: null }; break;
    case 'tclose': UI.trade = null; break;
    case 'tgive': UI.trade.give = arg; break;
    case 'tget': UI.trade.get = arg; break;
    case 'trade': if (UI.trade && UI.trade.give && UI.trade.get) bankTrade(h, UI.trade.give, UI.trade.get); break;
    case 'play': UI.mode = null; playDev(h, arg); break;
    case 'steal': doSteal(h, +arg); break;
    case 'yop': chooseYop(h, arg); break;
    case 'mono': chooseMono(h, arg); break;
    case 'bless': chooseBlessing(h, +arg); break;
    case 'pick': choosePickpocket(h, +arg); break;
    case 'skiproads': skipFreeRoads(h); break;
    case 'dinc': UI.discardSel[arg]++; break;
    case 'ddec': UI.discardSel[arg]--; break;
    case 'dok': doDiscard(h, UI.discardSel); break;
    case 'newgame': startGame(); break;
  }
  render();
}

function onBoardClick(ev) {
  const h = UI.human, pd = G.pending;
  const vEl = ev.target.closest('[data-vert]'), eEl = ev.target.closest('[data-edge]'), hEl = ev.target.closest('[data-hex]');
  if (vEl) {
    const v = +vEl.dataset.vert;
    if (pd && pd.kind === 'setupSettle' && pd.pid === h) doSetupSettle(h, v);
    else if (UI.mode === 'settlement' && doSettle(h, v)) UI.mode = null;
    else if (UI.mode === 'city' && doCity(h, v)) UI.mode = null;
  } else if (eEl) {
    const e = +eEl.dataset.edge;
    if (pd && pd.kind === 'setupRoad' && pd.pid === h) doSetupRoad(h, e);
    else if (pd && pd.kind === 'freeRoads' && pd.pid === h) doRoad(h, e);
    else if (UI.mode === 'road' && doRoad(h, e)) UI.mode = null;
  } else if (hEl && pd && pd.kind === 'robber' && pd.pid === h) {
    moveRobber(h, +hEl.dataset.hex);
  }
  render();
}

function init(data) {
  $('board').addEventListener('click', onBoardClick);
  document.addEventListener('click', ev => {
    const b = ev.target.closest('button[data-act]');
    if (b && !b.disabled) handleAct(b.dataset.act, b.dataset.arg);
  });
  document.addEventListener('keydown', ev => {
    if (ev.key !== 'Escape') return;
    if (UI.mode) UI.mode = null; else if (UI.trade) UI.trade = null; else return;
    render();
  });
  $('selSpeed').addEventListener('change', ev => { UI.speed = ev.target.value; });
  const saved = data && data.G;
  if (saved && saved.players && saved.hexes && typeof saved.rngState === 'number') {
    G = saved; if (data.speed) UI.speed = data.speed;
    $('selPlayers').value = String(G.players.length);
  } else startGame();
  $('selSpeed').value = UI.speed;
  const hot = window.claude && window.claude.hot;
  if (hot && hot.snapshot) hot.snapshot(() => ({ G, speed: UI.speed }));
  render();
}

if (typeof document !== 'undefined') {
  const hot = typeof window !== 'undefined' && window.claude && window.claude.hot;
  if (hot && hot.ready) hot.ready(init); else init((hot && hot.data) || {});
}

/* Exports for headless tests (Node loads this script in a vm context). */
if (typeof module !== 'undefined' && module.exports) {
  module.exports = {
    CONFIG, RES, GEO, DEV_INFO, getG: () => G, newGame, actorId, botAct, post, updateAwards,
    doSetupSettle, doSetupRoad, rollDice, doDiscard, moveRobber, doSteal, doRoad, doSettle, doCity,
    buyDev, bankTrade, endTurn, canPlayDev, playDev, skipFreeRoads, chooseYop, chooseMono,
    chooseBlessing, choosePickpocket, vpOf, longestRoadFor, handSize, tradeRate, validRoadEdges,
    validSettleSpots, canRoad,
  };
}
</script>
