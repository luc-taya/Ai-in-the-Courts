<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hexhaven</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
  /* Layout: the sea is the table. The island board sits in open water, white game panels float beside it, and your hand is docked along the bottom like cards held at the table edge. */
  :root {
    --sea-1: #2290c4; --sea-2: #11618f; --sea-3: #0a3a57;
    --panel: #ffffff; --panel-2: #eff3f7; --line: #d8e0e8;
    --ink: #1b2733; --muted: #5f6f81;
    --gold: #ffbe2e; --gold-ink: #3a2a00;
    --go: #22a35a; --go-2: #17803f;
    --dev-1: #4d40a6; --dev-2: #2b236c;
    --danger: #cf3b3b;
    --font: ui-rounded, "SF Pro Rounded", "Nunito", "Varela Round", "Segoe UI", system-ui, -apple-system, sans-serif;
    --font-num: ui-rounded, "SF Pro Rounded", "Segoe UI", system-ui, sans-serif;
    color-scheme: light;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; font: 15px/1.35 var(--font); color: var(--ink);
    background: radial-gradient(ellipse 90% 75% at 40% 45%, var(--sea-1), var(--sea-2) 55%, var(--sea-3));
    background-color: var(--sea-2); background-attachment: fixed;
  }
  button, select { font: inherit; color: inherit; }
  button { cursor: pointer; }
  button:focus-visible, select:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }
  #app { min-height: 100%; display: flex; flex-direction: column; }
  .gutter { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  .mi { width: 15px; height: 15px; vertical-align: -3px; flex: none; }

  /* top bar */
  .topbar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 18px; padding-block: 10px; color: #fff; }
  .brand { display: flex; align-items: center; gap: 8px; font-weight: 800; font-size: 21px; letter-spacing: .3px; }
  .brand svg { width: 30px; height: 30px; }
  #status { font-weight: 700; opacity: .85; font-variant-numeric: tabular-nums; }
  .controls { margin-left: auto; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; font-size: 13px; font-weight: 600; }
  .controls label { display: flex; gap: 6px; align-items: center; }
  .controls select, .ghost { background: rgba(255,255,255,.14); color: #fff; border: 1px solid rgba(255,255,255,.35); border-radius: 9px; padding: 5px 8px; }
  .controls select option { color: var(--ink); background: var(--panel); }
  .ghost { padding: 5px 13px; font-weight: 800; }
  .ghost:hover { background: rgba(255,255,255,.26); }

  /* board column + sidebar */
  .layout { flex: 1; display: grid; grid-template-columns: minmax(0, 1fr) 320px; gap: 16px; padding-block: 2px 14px; }
  .table { min-width: 0; display: flex; flex-direction: column; align-items: center; gap: 6px; }
  .prompt {
    display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 8px; max-width: 100%;
    background: var(--panel); color: var(--ink); border-radius: 18px; padding: 8px 16px; min-height: 44px;
    box-shadow: 0 8px 22px rgba(0, 20, 40, .3); font-weight: 700; text-align: center;
  }
  .prompt .msg { padding: 0 4px; }
  .prompt.mine { box-shadow: 0 0 0 3px var(--gold), 0 8px 22px rgba(0, 20, 40, .3); }
  #board { width: 100%; height: auto; max-height: calc(100vh - 260px); min-height: 330px; display: block; user-select: none; -webkit-user-select: none; }
  .side { display: flex; flex-direction: column; gap: 12px; min-width: 0; }
  .panel { background: var(--panel); border-radius: 16px; box-shadow: 0 10px 26px rgba(0, 20, 40, .25); padding: 10px; }
  .panel h2 { margin: 2px 6px 8px; font-size: 11.5px; text-transform: uppercase; letter-spacing: 1.1px; color: var(--muted); }

  /* players */
  #players { display: flex; flex-direction: column; gap: 4px; }
  .pl { display: grid; grid-template-columns: 42px minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 8px; border-radius: 12px; }
  .pl.cur { background: var(--panel-2); box-shadow: inset 0 0 0 2px var(--pc); }
  .av { width: 42px; height: 42px; border-radius: 50%; background: var(--pc); color: #fff; display: grid; place-items: center; box-shadow: inset 0 -3px 0 rgba(0,0,0,.22); }
  .av svg { width: 24px; height: 24px; }
  .pl-name { font-weight: 800; display: flex; align-items: center; gap: 6px; min-width: 0; }
  .pl-name span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .pl-stats { display: flex; flex-wrap: wrap; gap: 2px 10px; color: var(--muted); font-size: 12.5px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .st { display: inline-flex; align-items: center; gap: 3px; }
  .st .mi { width: 14px; height: 14px; }
  .pl-badges { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 4px; }
  .pl-badges:empty { display: none; }
  .badge { display: inline-flex; align-items: center; gap: 3px; font-size: 11px; font-weight: 800; padding: 2px 7px; border-radius: 999px; background: var(--panel-2); color: var(--muted); }
  .badge .mi { width: 12px; height: 12px; }
  .badge.award { background: var(--gold); color: var(--gold-ink); }
  .badge.ward { background: #d3ecfd; color: #0b5a88; }
  .badge.bless { background: #fff0c4; color: #765200; }
  .pl-vp { text-align: center; min-width: 46px; }
  .pl-vp b { display: block; font: 800 26px/1 var(--font-num); font-variant-numeric: tabular-nums; }
  .pl-vp small { font-size: 10px; color: var(--muted); font-weight: 800; letter-spacing: .6px; }
  .thinking { display: inline-flex; gap: 2px; }
  .thinking i { width: 5px; height: 5px; border-radius: 50%; background: var(--pc); animation: blink 1s infinite; }
  .thinking i:nth-child(2) { animation-delay: .15s; } .thinking i:nth-child(3) { animation-delay: .3s; }
  @keyframes blink { 0%, 100% { opacity: .2; } 50% { opacity: 1; } }

  /* log */
  .logp { flex: 1; display: flex; flex-direction: column; min-height: 170px; }
  #log { flex: 1; overflow-y: auto; max-height: 360px; font-size: 13px; padding: 0 6px; }
  #log div { padding: 3px 0; border-bottom: 1px solid var(--panel-2); }
  #log div.sep { color: var(--muted); font-weight: 800; font-size: 11px; text-transform: uppercase; letter-spacing: .7px; padding-top: 9px; border-bottom: 0; }
  #log b { font-weight: 800; }

  /* dock */
  .dock { background: var(--panel); box-shadow: 0 -10px 26px rgba(0, 20, 40, .25); border-radius: 18px 18px 0 0; }
  .dock-inner { display: flex; flex-wrap: wrap; align-items: center; gap: 14px 24px; padding-block: 14px 12px; }
  .cards { display: flex; flex-wrap: wrap; gap: 9px; align-items: flex-end; }
  .rcard {
    position: relative; width: 58px; height: 80px; border-radius: 10px; border: 0; padding: 0;
    background: linear-gradient(160deg, var(--c1), var(--c2)); color: #fff;
    box-shadow: 0 3px 0 rgba(0,0,0,.2), inset 0 0 0 2px rgba(255,255,255,.45);
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px;
  }
  .rcard .art { width: 38px; height: 38px; border-radius: 50%; background: rgba(255,255,255,.88); display: grid; place-items: center; box-shadow: 0 1px 2px rgba(0,0,0,.25); }
  .rcard .art svg { width: 28px; height: 28px; }
  .rcard .nm { font-size: 10.5px; font-weight: 800; text-shadow: 0 1px 1px rgba(0,0,0,.4); }
  .rcard .n {
    position: absolute; top: -8px; right: -8px; min-width: 24px; height: 24px; padding: 0 6px; border-radius: 12px;
    background: var(--ink); color: #fff; font: 800 13px/24px var(--font-num); text-align: center; font-variant-numeric: tabular-nums;
    box-shadow: 0 0 0 2px var(--panel);
  }
  .rcard.zero { filter: grayscale(.75) opacity(.45); }
  .r-wood { --c1: #4ea046; --c2: #256a2b; } .r-brick { --c1: #e2855a; --c2: #a54a2a; }
  .r-wool { --c1: #9fd06a; --c2: #5c9a33; } .r-grain { --c1: #f4c94a; --c2: #cf931a; } .r-ore { --c1: #a3aebb; --c2: #5f6a77; }
  .dcard {
    position: relative; width: 136px; min-height: 80px; border-radius: 10px; padding: 7px 9px; color: #fff;
    background: linear-gradient(160deg, var(--dev-1), var(--dev-2)); box-shadow: 0 3px 0 rgba(0,0,0,.22), inset 0 0 0 2px rgba(255,255,255,.22);
    display: flex; flex-direction: column; gap: 3px;
  }
  .dcard .dn { font-weight: 800; font-size: 12.5px; line-height: 1.15; padding-right: 16px; }
  .dcard .dd { font-size: 10.5px; opacity: .85; line-height: 1.2; flex: 1; }
  .dcard .n { top: -8px; right: -8px; position: absolute; min-width: 22px; height: 22px; border-radius: 11px; background: var(--gold); color: var(--gold-ink); font: 800 12px/22px var(--font-num); text-align: center; box-shadow: 0 0 0 2px var(--panel); }
  .dcard button { align-self: flex-start; background: var(--gold); color: var(--gold-ink); border: 0; border-radius: 7px; padding: 3px 12px; font-weight: 800; font-size: 12px; }
  .dcard button:disabled { background: rgba(255,255,255,.18); color: rgba(255,255,255,.6); cursor: default; }
  .dcard .vpnote { font-size: 11px; font-weight: 800; color: var(--gold); }
  .tag { display: inline-block; font-size: 9px; font-weight: 800; letter-spacing: .5px; padding: 1px 5px; border-radius: 4px; background: #86d6ff; color: #06324d; vertical-align: 1px; margin-left: 2px; }
  .tag.new { background: rgba(255,255,255,.25); color: #fff; }
  .nodev { color: var(--muted); font-size: 12.5px; font-weight: 700; max-width: 140px; }
  .actions { display: flex; flex-wrap: wrap; gap: 8px; }
  .abtn {
    position: relative; width: 76px; padding: 7px 4px 6px; border-radius: 13px; border: 0; background: var(--panel-2); box-shadow: 0 3px 0 var(--line);
    display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: 12px; font-weight: 800; color: var(--ink);
  }
  .abtn .big { width: 30px; height: 30px; color: var(--me); }
  .abtn .cost { display: flex; gap: 1px; min-height: 12px; } .abtn .cost .mi { width: 12px; height: 12px; }
  .abtn .left { position: absolute; top: 4px; right: 7px; font-size: 10px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .abtn:hover:not(:disabled) { background: #e3e9f0; }
  .abtn.active { background: var(--gold); box-shadow: 0 3px 0 #c38a00; }
  .abtn:disabled { opacity: .38; cursor: default; }
  .turnp { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 8px 14px; align-items: center; padding: 12px; }
  .turnp #dice { grid-row: 1 / span 2; }
  #dice { display: flex; align-items: center; gap: 8px; }
  .die {
    width: 44px; height: 44px; border-radius: 10px; background: #fff; border: 1px solid #c7d0da;
    box-shadow: inset 0 -4px 0 #dce3ea, 0 3px 8px rgba(0,0,0,.18);
    display: grid; grid-template: repeat(3, 1fr) / repeat(3, 1fr); padding: 7px; gap: 2px;
  }
  .die i { border-radius: 50%; }
  .die i.on { background: var(--ink); }
  .die.red i.on { background: var(--danger); }
  #dice.idle .die { opacity: .4; }
  .dsum { font: 800 24px var(--font-num); min-width: 30px; text-align: center; font-variant-numeric: tabular-nums; }
  #dice.rolling .die { animation: tumble .5s cubic-bezier(.2,.8,.3,1.2); }
  #dice.rolling .die + .die { animation-delay: .06s; }
  @keyframes tumble { 0% { transform: rotate(-220deg) scale(.5); } 100% { transform: none; } }
  .big-btn { border: 0; border-radius: 13px; padding: 11px 16px; font-weight: 800; font-size: 16px; color: #fff; background: var(--go); box-shadow: 0 4px 0 var(--go-2); }
  .big-btn.end { background: var(--ink); box-shadow: 0 4px 0 #05090d; }
  .big-btn:disabled { background: #c9d1da; box-shadow: 0 4px 0 #adb7c2; cursor: default; }
  .big-btn:not(:disabled):active { transform: translateY(2px); box-shadow: 0 2px 0 var(--go-2); }

  /* prompt chips */
  .chip { display: inline-flex; align-items: center; gap: 6px; border: 0; border-radius: 999px; padding: 6px 13px; background: var(--panel-2); font-weight: 800; box-shadow: 0 2px 0 var(--line); }
  .chip:hover:not(:disabled) { background: var(--gold); }
  .chip:disabled { opacity: .4; cursor: default; }
  .chip .dot { width: 11px; height: 11px; border-radius: 50%; }
  .numchip { width: 40px; height: 40px; border-radius: 50%; border: 0; background: #f7ecd2; box-shadow: 0 2px 0 #c2ad80; font: 800 16px/1 var(--font-num); display: inline-flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; }
  .numchip i { font-style: normal; font-size: 7px; letter-spacing: 1px; line-height: 1; }
  .numchip.hot { color: var(--danger); }
  .numchip:hover { background: var(--gold); }

  /* modals */
  .backdrop { position: fixed; inset: 0; background: rgba(4, 24, 38, .62); display: flex; align-items: center; justify-content: center; z-index: 20; padding: 16px; }
  .backdrop[hidden] { display: none; }
  .sheet { background: var(--panel); border-radius: 20px; padding: 20px 22px; box-shadow: 0 24px 60px rgba(0,0,0,.45); width: 470px; max-width: 100%; }
  .sheet h3 { margin: 0 0 4px; font-size: 21px; text-wrap: balance; }
  .sheet p { margin: 0 0 16px; color: var(--muted); font-weight: 600; }
  .sheet .lbl { font-size: 11.5px; text-transform: uppercase; letter-spacing: 1px; color: var(--muted); font-weight: 800; margin: 14px 0 10px; }
  .sheet .row { display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; }
  .pick { display: flex; flex-direction: column; align-items: center; gap: 8px; }
  .stepper { display: flex; align-items: center; gap: 6px; font-weight: 800; font-variant-numeric: tabular-nums; }
  .stepper button { width: 26px; height: 26px; border-radius: 50%; border: 0; background: var(--panel-2); font-weight: 800; box-shadow: 0 2px 0 var(--line); }
  .stepper button:disabled { opacity: .35; cursor: default; }
  .sheet .foot { display: flex; flex-wrap: wrap; justify-content: flex-end; align-items: center; gap: 8px; margin-top: 20px; }
  .sheet .sum { margin-right: auto; font-weight: 800; display: flex; align-items: center; gap: 4px; }
  .btn { border: 0; border-radius: 11px; padding: 10px 18px; font-weight: 800; background: var(--panel-2); box-shadow: 0 3px 0 var(--line); }
  .btn.primary { background: var(--go); color: #fff; box-shadow: 0 3px 0 var(--go-2); }
  .btn:disabled { opacity: .45; cursor: default; }
  button.rcard:disabled { filter: grayscale(.8) opacity(.38); cursor: default; }
  .rcard.sel { outline: 3px solid var(--gold); outline-offset: 3px; }
  .rcard .rate { position: absolute; bottom: -10px; left: 50%; transform: translateX(-50%); background: var(--panel); color: var(--ink); font: 800 11px/1 var(--font-num); padding: 3px 6px; border-radius: 7px; box-shadow: 0 1px 4px rgba(0,0,0,.3); white-space: nowrap; }
  .standings { display: flex; flex-direction: column; gap: 6px; margin-top: 8px; }
  .standings .pl { background: var(--panel-2); }
  .trophy { width: 54px; height: 54px; color: var(--gold); filter: drop-shadow(0 2px 2px rgba(0,0,0,.2)); }

  /* board */
  .hex { stroke: rgba(60, 40, 10, .28); stroke-width: 1.5; }
  .hex.hex-target { stroke: #fff; stroke-width: 5; cursor: pointer; animation: pulseH .9s ease-in-out infinite alternate; }
  .hex.hex-target:hover { stroke: var(--gold); }
  .target { fill: #fff; fill-opacity: .95; stroke: var(--gold); stroke-width: 3; cursor: pointer; animation: pulse .9s ease-in-out infinite alternate; }
  .target:hover { fill: var(--gold); }
  .edge-target { cursor: pointer; }
  .target-edge { stroke: #fff; stroke-width: 7; stroke-linecap: round; stroke-dasharray: .5 10; }
  .edge-target:hover .target-edge { stroke: var(--gold); }
  .edge-target:hover .target { fill: var(--gold); }
  @keyframes pulse { from { stroke-width: 2; } to { stroke-width: 5; } }
  @keyframes pulseH { from { stroke-opacity: .4; } to { stroke-opacity: 1; } }
  .tok { fill: #f7ecd2; stroke: #b9a274; stroke-width: 1.5; }
  .tok.hit { stroke: var(--gold); stroke-width: 4.5; }
  .num { font: 800 18px var(--font-num); text-anchor: middle; dominant-baseline: central; fill: #2a2a2a; }
  .num.hot { fill: #c62828; }
  .portlbl { font: 800 10.5px var(--font-num); text-anchor: middle; dominant-baseline: central; fill: #5a3a18; }
  .portlbl.big { font-size: 13px; }

  @media (min-width: 981px) and (min-height: 640px) {
    /* desktop: one screen, nothing scrolls except the log */
    #app { height: 100%; display: grid; grid-template-rows: auto minmax(0, 1fr) auto; }
    .layout { min-height: 0; }
    .table { min-height: 0; }
    #board { flex: 1 1 0; min-height: 0; max-height: none; height: 100%; }
    .side { min-height: 0; overflow-y: auto; }
    .logp { min-height: 120px; }
    #log { max-height: none; min-height: 0; }
  }
  @media (max-width: 980px) {
    /* phone/tablet: board, then your turn controls and hand, then players and log */
    .layout, .side { display: contents; }
    .table, .side > .panel { margin-inline: max(16px, env(safe-area-inset-left, 0px)) max(16px, env(safe-area-inset-right, 0px)); margin-bottom: 12px; }
    .table { order: 1; } .turnp { order: 2; } .dock { order: 3; margin-bottom: 12px; border-radius: 18px; } .side > .panel:first-child { order: 4; } .logp { order: 5; }
    #board { max-height: none; }
    #log { max-height: 220px; }
    .turnp { grid-template-columns: auto 1fr 1fr; }
    .turnp #dice { grid-row: auto; }
  }
  @media (max-width: 520px) {
    .rcard { width: 52px; height: 74px; }
    .dcard { width: 128px; }
    .abtn { width: 66px; }
    .controls { margin-left: 0; }
  }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; } }
</style>
</head>
