# Tests and lint on every push and pull request. No keys or credentials, and no network use beyond package installs.
# The browser tests run against a synthetic fixture index (citecheck/e2e), so no real index is needed.
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  python:
    name: Python ${{ matrix.python-version }} (pytest, ruff)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.12 catches code that only works on 3.14 (DECISIONS.md D001); 3.14 is what runs locally.
        python-version: ["3.12", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -r requirements.txt
      - run: python -m pytest -q
      - run: python -m ruff check .

  node:
    name: CiteCheck (Vitest, eslint, tsc, Playwright)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: citecheck
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24.22.1
      - run: npm ci
      - run: npm test
      - run: npm run lint
      - run: npm run typecheck
      - run: node node_modules/@playwright/test/cli.js install --with-deps chromium
      - run: npm run e2e
